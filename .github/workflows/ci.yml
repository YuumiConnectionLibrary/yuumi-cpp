name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-amd64-debug
            os: windows-latest
            configure-preset: windows-msvc-debug
            build-preset: windows-msvc-debug-build
            compiler_launcher: sccache
          - label: windows-amd64-release
            os: windows-latest
            configure-preset: windows-msvc-release
            build-preset: windows-msvc-release-build
            compiler_launcher: sccache
          - label: linux-amd64-debug
            os: ubuntu-latest
            configure-preset: linux-clang-debug
            build-preset: linux-clang-debug-build
            compiler_launcher: ccache
          - label: linux-amd64-release
            os: ubuntu-latest
            configure-preset: linux-clang-release
            build-preset: linux-clang-release-build
            compiler_launcher: ccache
          - label: linux-amd64-address
            os: ubuntu-latest
            configure-preset: linux-clang-address
            build-preset: linux-clang-address-build
            compiler_launcher: ccache
          - label: linux-amd64-thread
            os: ubuntu-latest
            configure-preset: linux-clang-thread
            build-preset: linux-clang-thread-build
            compiler_launcher: ccache
          - label: macos-arm64-debug
            os: macos-latest
            configure-preset: macos-clang-debug
            build-preset: macos-clang-debug-build
            compiler_launcher: ccache
          - label: macos-arm64-release
            os: macos-latest
            configure-preset: macos-clang-release
            build-preset: macos-clang-release-build
            compiler_launcher: ccache

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      CMAKE_C_COMPILER_LAUNCHER: ${{ matrix.compiler_launcher }}
      CMAKE_CXX_COMPILER_LAUNCHER: ${{ matrix.compiler_launcher }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical specification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: YuumiConnectionLibrary/yuumi-spec
          ref: dev
          path: yuumi-spec
          fetch-depth: 1
          persist-credentials: false

      - name: Ensure vcpkg checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d vcpkg ]]; then
            git clone https://github.com/microsoft/vcpkg vcpkg
            git -C vcpkg checkout d015e31e90838a4c9dfa3eed45979bc70d9357fc
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-

      - name: Ensure vcpkg cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "${{ github.workspace }}/.vcpkg-cache" -Force | Out-Null

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c
        with:
          arch: amd64

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a
        with:
          version: v0.7.7

      - name: Setup Unix toolchain
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update -q
            sudo apt-get install -y build-essential cmake ninja-build curl zip unzip tar pkg-config ccache clang
          else
            brew install cmake ninja ccache
          fi

      - name: Configure vcpkg environment
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset ${{ matrix.configure-preset }} -DYUUMI_SPEC_DIR=${{ github.workspace }}/yuumi-spec

      - name: Build
        run: cmake --build --preset ${{ matrix.build-preset }}

      - name: Engine conformance
        run: ctest --preset ${{ matrix.configure-preset }}-test --output-on-failure
