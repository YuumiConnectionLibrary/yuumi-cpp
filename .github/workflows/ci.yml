name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  YUUMI_SPEC_SHA: 45729f1075ec5afcd9fd811db944385d6672eec3
  VCPKG_SHA: d015e31e90838a4c9dfa3eed45979bc70d9357fc
  PYTHON_VERSION: 3.x
  GO_VERSION: stable

jobs:
  verify-spec:
    name: Pinned spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pinned specification
        uses: actions/checkout@v6
        with:
          repository: YuumiConnectionLibrary/yuumi-spec
          ref: ${{ env.YUUMI_SPEC_SHA }}
          path: yuumi-spec
          fetch-depth: 1
          persist-credentials: false
      - name: Set up latest stable Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate exact spec revision and contract data
        run: >-
          python yuumi-spec/conformance/spec_ci.py
          --spec-sha ${{ env.YUUMI_SPEC_SHA }}
          --output-dir artifacts/spec
      - name: Upload spec evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yuumi-cpp-spec-${{ env.YUUMI_SPEC_SHA }}
          path: artifacts/spec
          if-no-files-found: error
          retention-days: 14

  test:
    name: C++23 ${{ matrix.os }}
    needs: verify-spec
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out C++ SDK
        uses: actions/checkout@v6
        with:
          path: yuumi-cpp
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned specification
        uses: actions/checkout@v6
        with:
          repository: YuumiConnectionLibrary/yuumi-spec
          ref: ${{ env.YUUMI_SPEC_SHA }}
          path: yuumi-spec
          fetch-depth: 1
          persist-credentials: false
      - name: Check out Go client
        uses: actions/checkout@v6
        with:
          repository: YuumiConnectionLibrary/Yuumi
          ref: dev
          path: Yuumi
          fetch-depth: 1
          persist-credentials: false
      - name: Set up latest stable Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check out pinned vcpkg
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg yuumi-cpp/vcpkg
          git -C yuumi-cpp/vcpkg checkout $env:VCPKG_SHA
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        run: .\yuumi-cpp\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        run: ./yuumi-cpp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: >-
          cmake -S yuumi-cpp -B yuumi-cpp/build/ci -A x64
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/yuumi-cpp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DYUUMI_SPEC_DIR=${{ github.workspace }}/yuumi-spec
          -DYUUMI_BUILD_INTEROP_TESTS=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: >-
          cmake -S yuumi-cpp -B yuumi-cpp/build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/yuumi-cpp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DYUUMI_SPEC_DIR=${{ github.workspace }}/yuumi-spec
          -DYUUMI_BUILD_INTEROP_TESTS=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: >-
          cmake -S yuumi-cpp -B yuumi-cpp/build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/yuumi-cpp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DYUUMI_SPEC_DIR=${{ github.workspace }}/yuumi-spec
          -DYUUMI_BUILD_INTEROP_TESTS=ON
      - name: Build validation targets
        run: cmake --build yuumi-cpp/build/ci --config Debug
      - name: Validate install package
        run: cmake --install yuumi-cpp/build/ci --config Debug --prefix artifacts/package
      - name: Run conformance and real Go interop
        if: always()
        run: >-
          python yuumi-spec/conformance/harness.py
          --repositories-root .
          --spec-sha ${{ env.YUUMI_SPEC_SHA }}
          --platform ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'macos' || 'linux' }}
          --sdk cpp
          --stage all
          --cpp-build-dir yuumi-cpp/build/ci
          --output-dir artifacts/harness
          --timeout 300
      - name: Record toolchain and cleanup diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          "spec_sha=$env:YUUMI_SPEC_SHA" | Out-File artifacts/toolchains.txt -Encoding utf8
          cmake --version 2>&1 | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
          go version 2>&1 | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
          git -C yuumi-cpp rev-parse HEAD | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
          git -C yuumi-spec rev-parse HEAD | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
          git -C Yuumi rev-parse HEAD | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
      - name: Upload cell evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yuumi-cpp-${{ matrix.os }}-${{ env.YUUMI_SPEC_SHA }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: C++ ${{ matrix.sanitizer }}
    needs: verify-spec
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sanitizer: asan-ubsan
            mode: address
          - sanitizer: tsan
            mode: thread
    steps:
      - name: Check out C++ SDK
        uses: actions/checkout@v6
        with:
          path: yuumi-cpp
          fetch-depth: 1
          persist-credentials: false
      - name: Check out pinned specification
        uses: actions/checkout@v6
        with:
          repository: YuumiConnectionLibrary/yuumi-spec
          ref: ${{ env.YUUMI_SPEC_SHA }}
          path: yuumi-spec
          fetch-depth: 1
          persist-credentials: false
      - name: Check out Go client
        uses: actions/checkout@v6
        with:
          repository: YuumiConnectionLibrary/Yuumi
          ref: dev
          path: Yuumi
          fetch-depth: 1
          persist-credentials: false
      - name: Set up latest stable Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up latest stable Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check out and bootstrap pinned vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg yuumi-cpp/vcpkg
          git -C yuumi-cpp/vcpkg checkout $VCPKG_SHA
          ./yuumi-cpp/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure sanitizer build
        run: >-
          cmake -S yuumi-cpp -B yuumi-cpp/build/sanitizer -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/yuumi-cpp/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DYUUMI_SPEC_DIR=${{ github.workspace }}/yuumi-spec
          -DYUUMI_BUILD_INTEROP_TESTS=ON
          -DYUUMI_SANITIZER=${{ matrix.mode }}
      - name: Build sanitized targets
        run: cmake --build yuumi-cpp/build/sanitizer
      - name: Run sanitized conformance and interop
        if: always()
        run: >-
          python yuumi-spec/conformance/harness.py
          --repositories-root .
          --spec-sha ${{ env.YUUMI_SPEC_SHA }}
          --platform linux
          --sdk cpp
          --stage all
          --cpp-build-dir yuumi-cpp/build/sanitizer
          --output-dir artifacts/harness
          --timeout 360
      - name: Record sanitizer diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          "spec_sha=$env:YUUMI_SPEC_SHA" | Out-File artifacts/toolchains.txt -Encoding utf8
          g++ --version 2>&1 | Select-Object -First 1 | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
          cmake --version 2>&1 | Select-Object -First 1 | Out-File artifacts/toolchains.txt -Encoding utf8 -Append
      - name: Upload sanitizer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yuumi-cpp-${{ matrix.sanitizer }}-${{ env.YUUMI_SPEC_SHA }}
          path: artifacts
          if-no-files-found: error
          retention-days: 14
